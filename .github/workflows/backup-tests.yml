name: Backup tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backup image
        run: docker build -t paas-backup:verification backup
      - name: Test failure handling
        run: docker run --rm -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/work:ro" -w /work --entrypoint python3 paas-backup:verification -m unittest discover -s tests -v
      - name: Test real PostgreSQL restore
        run: bash tests/integration.sh
